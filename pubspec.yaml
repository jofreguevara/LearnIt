name: learnit
description: Practica inglés con un compañero digital totalmente local.
publish_to: "none"
version: 0.7.0+7

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  ffi: ^2.1.3
  flutter_svg: ^2.0.17
  path: ^1.9.0
  path_provider: ^2.1.5
  # 6.2.x keeps compatibility with Dart 3.5+ while exposing PCM16 streams.
  record: ^6.2.1
  sqflite: ^2.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/topics/
